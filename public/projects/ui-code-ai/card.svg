<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>UI 코드 자동화 — 디자인에서 컴포넌트 코드로</title>
  <!-- Card cover only: no text (it is shown small). Light tone so it differs from the dark Decision Graph cover. -->
  <!-- Our own illustration of design → code; nothing from the product or internal data. -->
  <rect width="1200" height="750" fill="#f3ede4"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e7dfd3" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Design: a phone screen -->
  <g>
    <rect x="150" y="40" width="270" height="470" rx="40" fill="#ffffff" stroke="#d6ccbf" stroke-width="3"/>
    <rect x="240" y="58" width="90" height="12" rx="6" fill="#e4dbcf"/>
    <rect x="178" y="92" width="214" height="104" rx="16" fill="#f6d9c8"/>
    <circle cx="222" cy="144" r="22" fill="#eab597"/>
    <rect x="178" y="214" width="150" height="14" rx="7" fill="#2a2622"/>
    <rect x="178" y="238" width="190" height="10" rx="5" fill="#cfc5b8"/>
    <!-- Repeated list rows, grouped into one component (dashed outline) -->
    <rect x="168" y="266" width="234" height="176" rx="14" fill="none" stroke="#d9581f" stroke-width="3" stroke-dasharray="10 8"/>
    <g>
      <circle cx="202" cy="296" r="16" fill="#e4dbcf"/>
      <rect x="228" y="286" width="120" height="10" rx="5" fill="#8f857a"/>
      <rect x="228" y="302" width="80" height="8" rx="4" fill="#d6ccbf"/>
      <circle cx="202" cy="352" r="16" fill="#e4dbcf"/>
      <rect x="228" y="342" width="130" height="10" rx="5" fill="#8f857a"/>
      <rect x="228" y="358" width="70" height="8" rx="4" fill="#d6ccbf"/>
      <circle cx="202" cy="408" r="16" fill="#e4dbcf"/>
      <rect x="228" y="398" width="110" height="10" rx="5" fill="#8f857a"/>
      <rect x="228" y="414" width="90" height="8" rx="4" fill="#d6ccbf"/>
    </g>
    <rect x="178" y="458" width="214" height="36" rx="18" fill="#d9581f"/>
  </g>

  <!-- Transform -->
  <g>
    <circle cx="510" cy="270" r="42" fill="#1d1a17"/>
    <path d="M492 270 H 524 M512 256 L 527 270 L 512 284" fill="none" stroke="#f2814b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Code: component code in an editor -->
  <g>
    <rect x="600" y="70" width="470" height="400" rx="26" fill="#1d1a17"/>
    <circle cx="634" cy="102" r="7" fill="#5a524a"/>
    <circle cx="656" cy="102" r="7" fill="#5a524a"/>
    <circle cx="678" cy="102" r="7" fill="#5a524a"/>
    <!-- code lines: keyword / name / props, indented like a component -->
    <rect x="636" y="140" width="70" height="14" rx="7" fill="#f2814b"/>
    <rect x="716" y="140" width="150" height="14" rx="7" fill="#efe9e1"/>
    <rect x="664" y="176" width="90" height="14" rx="7" fill="#9bb8a6"/>
    <rect x="764" y="176" width="130" height="14" rx="7" fill="#8f857a"/>
    <rect x="664" y="212" width="60" height="14" rx="7" fill="#f2814b"/>
    <rect x="692" y="248" width="110" height="14" rx="7" fill="#efe9e1"/>
    <rect x="812" y="248" width="90" height="14" rx="7" fill="#9bb8a6"/>
    <rect x="720" y="284" width="140" height="14" rx="7" fill="#8f857a"/>
    <rect x="720" y="320" width="100" height="14" rx="7" fill="#8f857a"/>
    <rect x="692" y="356" width="80" height="14" rx="7" fill="#efe9e1"/>
    <rect x="664" y="392" width="40" height="14" rx="7" fill="#f2814b"/>
    <rect x="636" y="428" width="24" height="14" rx="7" fill="#efe9e1"/>
    <!-- the generated component highlighted, matching the dashed group on the left -->
    <rect x="680" y="238" width="236" height="134" rx="10" fill="none" stroke="#d9581f" stroke-width="3" stroke-dasharray="10 8"/>
  </g>

  <!-- Several platforms from one design -->
  <g>
    <rect x="1090" y="120" width="70" height="70" rx="18" fill="#ffffff" stroke="#d6ccbf" stroke-width="3"/>
    <rect x="1090" y="210" width="70" height="70" rx="18" fill="#ffffff" stroke="#d6ccbf" stroke-width="3"/>
    <rect x="1090" y="300" width="70" height="70" rx="18" fill="#ffffff" stroke="#d6ccbf" stroke-width="3"/>
    <circle cx="1125" cy="155" r="14" fill="#9bb8a6"/>
    <rect x="1111" y="231" width="28" height="28" rx="6" fill="#f2814b"/>
    <path d="M1125 318 L 1142 350 H 1108 Z" fill="#8f857a"/>
  </g>
</svg>
