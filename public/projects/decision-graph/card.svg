<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>Decision Graph — 대화에서 결정 그래프로</title>
  <!-- Card cover only: no text (it is shown small). Dark tone so it differs from the light UI code AI cover. -->
  <!-- The card lays its headline over the bottom ~45%, so the drawing stays in the top part. -->
  <rect width="1200" height="750" fill="#1b1916"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8672a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8672a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2e2a26"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <!-- Conversation: chat bubbles, one holds a decision -->
  <g>
    <rect x="90" y="70" width="300" height="70" rx="35" fill="#2c2824"/>
    <rect x="125" y="96" width="190" height="10" rx="5" fill="#4d463f"/>
    <rect x="125" y="114" width="120" height="10" rx="5" fill="#4d463f"/>

    <rect x="170" y="165" width="260" height="70" rx="35" fill="#2c2824"/>
    <rect x="205" y="191" width="170" height="10" rx="5" fill="#4d463f"/>
    <rect x="205" y="209" width="100" height="10" rx="5" fill="#4d463f"/>

    <rect x="90" y="260" width="330" height="78" rx="39" fill="#3a2a20" stroke="#e8672a" stroke-width="3"/>
    <rect x="128" y="288" width="210" height="11" rx="5.5" fill="#e8672a"/>
    <rect x="128" y="308" width="140" height="11" rx="5.5" fill="#b4542a"/>

    <rect x="150" y="363" width="240" height="70" rx="35" fill="#2c2824"/>
    <rect x="185" y="389" width="150" height="10" rx="5" fill="#4d463f"/>
    <rect x="185" y="407" width="90" height="10" rx="5" fill="#4d463f"/>
  </g>

  <!-- Extraction: the highlighted message becomes the central decision -->
  <path d="M424 299 C 520 299, 560 250, 690 245" fill="none" stroke="#e8672a" stroke-width="3" stroke-dasharray="10 9"/>

  <!-- Decision graph -->
  <g stroke="#5a524a" stroke-width="3" fill="none">
    <line x1="760" y1="245" x2="700" y2="120"/>
    <line x1="760" y1="245" x2="890" y2="105"/>
    <line x1="760" y1="245" x2="930" y2="290"/>
    <line x1="760" y1="245" x2="720" y2="390"/>
    <line x1="890" y1="105" x2="1060" y2="150"/>
    <line x1="930" y1="290" x2="1060" y2="150"/>
    <line x1="930" y1="290" x2="1080" y2="370"/>
    <line x1="700" y1="120" x2="890" y2="105"/>
  </g>
  <!-- A replaced decision (dashed) and a conflict (accent) -->
  <line x1="930" y1="290" x2="880" y2="420" stroke="#5a524a" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="1060" y1="150" x2="1110" y2="60" stroke="#e8672a" stroke-width="3"/>

  <circle cx="760" cy="245" r="110" fill="url(#glow)"/>
  <circle cx="700" cy="120" r="24" fill="#efe9e1"/>
  <circle cx="890" cy="105" r="20" fill="#efe9e1"/>
  <circle cx="930" cy="290" r="30" fill="#efe9e1"/>
  <circle cx="720" cy="390" r="18" fill="#efe9e1"/>
  <circle cx="1060" cy="150" r="24" fill="#efe9e1"/>
  <circle cx="1080" cy="370" r="18" fill="#efe9e1"/>
  <circle cx="880" cy="420" r="16" fill="none" stroke="#7a7066" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="1110" cy="60" r="16" fill="#1b1916" stroke="#e8672a" stroke-width="4"/>

  <!-- Central decision with a grounded check -->
  <circle cx="760" cy="245" r="46" fill="#e8672a"/>
  <path d="M739 246 L 754 261 L 783 230" fill="none" stroke="#1b1916" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
