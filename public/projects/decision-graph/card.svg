<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title>Decision Graph 흐름</title><rect width="1200" height="750" fill="#f6f3ee"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8b0a5"/></marker></defs>
<g transform="translate(0,-140)"><rect x="60" y="215" width="196" height="170" rx="18" fill="#ffffff" stroke="#e2dcd2" stroke-width="2"/><text x="80" y="249" font-size="14" fill="#6b6660" letter-spacing="2">01 / SPLIT</text><text x="80" y="285" font-size="22" font-weight="700" fill="#18181b">분석 단위</text><text x="80" y="319" font-size="16" fill="#6b6660">대화·문서를</text><text x="80" y="345" font-size="16" fill="#6b6660">스레드·섹션 단위로</text><line x1="260" y1="300" x2="288" y2="300" stroke="#b8b0a5" stroke-width="3" marker-end="url(#a)"/><rect x="292" y="215" width="196" height="170" rx="18" fill="#ffffff" stroke="#e2dcd2" stroke-width="2"/><text x="312" y="249" font-size="14" fill="#6b6660" letter-spacing="2">02 / TRIAGE</text><text x="312" y="285" font-size="22" font-weight="700" fill="#18181b">1차 분류</text><text x="312" y="319" font-size="16" fill="#6b6660">경량 모델</text><text x="312" y="345" font-size="16" fill="#6b6660">애매하면 통과</text><line x1="492" y1="300" x2="520" y2="300" stroke="#b8b0a5" stroke-width="3" marker-end="url(#a)"/><rect x="524" y="215" width="196" height="170" rx="18" fill="#fbe6da" stroke="#d9581f" stroke-width="2"/><text x="544" y="249" font-size="14" fill="#d9581f" letter-spacing="2">03 / EXTRACT</text><text x="544" y="285" font-size="22" font-weight="700" fill="#18181b">결정 추출</text><text x="544" y="319" font-size="16" fill="#18181b">메인 모델</text><text x="544" y="345" font-size="16" fill="#18181b">대화 단위로 한 번에</text><line x1="724" y1="300" x2="752" y2="300" stroke="#b8b0a5" stroke-width="3" marker-end="url(#a)"/><rect x="756" y="215" width="196" height="170" rx="18" fill="#ffffff" stroke="#e2dcd2" stroke-width="2"/><text x="776" y="249" font-size="14" fill="#6b6660" letter-spacing="2">04 / VERIFY</text><text x="776" y="285" font-size="22" font-weight="700" fill="#18181b">근거 검증</text><text x="776" y="319" font-size="16" fill="#6b6660">문장 번호 인용</text><text x="776" y="345" font-size="16" fill="#6b6660">코드 + 모델 2중 확인</text><line x1="956" y1="300" x2="984" y2="300" stroke="#b8b0a5" stroke-width="3" marker-end="url(#a)"/><rect x="988" y="215" width="196" height="170" rx="18" fill="#1d1a17" stroke="#1d1a17" stroke-width="2"/><text x="1008" y="249" font-size="14" fill="#f2814b" letter-spacing="2">05 / GRAPH</text><text x="1008" y="285" font-size="22" font-weight="700" fill="#efe9e1">관계·그래프</text><text x="1008" y="319" font-size="16" fill="#efe9e1">중복·번복·의존</text><text x="1008" y="345" font-size="16" fill="#efe9e1">확신 낮으면 사람 검토</text></g>
</svg>