<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title>Decision Graph 파이프라인 개요</title><rect width="1200" height="675" fill="#f6f3ee"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8b0a5"/></marker></defs>
<text x="60" y="84" font-size="18" fill="#d9581f" letter-spacing="3">OVERVIEW</text>
<text x="60" y="130" font-size="36" font-weight="700" fill="#18181b">흩어진 대화에서 근거 있는 결정으로</text>
<text x="60" y="170" font-size="19" fill="#6b6660">Slack·Notion에서 "누가, 무엇을, 왜" 결정했는지 원문 근거와 함께 추출합니다.</text>
<rect x="60" y="215" width="196" height="170" rx="18" fill="#ffffff" stroke="#e2dcd2" stroke-width="2"/><text x="80" y="249" font-size="14" fill="#6b6660" letter-spacing="2">01 / SPLIT</text><text x="80" y="285" font-size="22" font-weight="700" fill="#18181b">분석 단위</text><text x="80" y="319" font-size="16" fill="#6b6660">대화·문서를</text><text x="80" y="345" font-size="16" fill="#6b6660">스레드·섹션 단위로</text><line x1="260" y1="300" x2="288" y2="300" stroke="#b8b0a5" stroke-width="3" marker-end="url(#a)"/><rect x="292" y="215" width="196" height="170" rx="18" fill="#ffffff" stroke="#e2dcd2" stroke-width="2"/><text x="312" y="249" font-size="14" fill="#6b6660" letter-spacing="2">02 / TRIAGE</text><text x="312" y="285" font-size="22" font-weight="700" fill="#18181b">1차 분류</text><text x="312" y="319" font-size="16" fill="#6b6660">경량 모델</text><text x="312" y="345" font-size="16" fill="#6b6660">애매하면 통과</text><line x1="492" y1="300" x2="520" y2="300" stroke="#b8b0a5" stroke-width="3" marker-end="url(#a)"/><rect x="524" y="215" width="196" height="170" rx="18" fill="#fbe6da" stroke="#d9581f" stroke-width="2"/><text x="544" y="249" font-size="14" fill="#d9581f" letter-spacing="2">03 / EXTRACT</text><text x="544" y="285" font-size="22" font-weight="700" fill="#18181b">결정 추출</text><text x="544" y="319" font-size="16" fill="#18181b">메인 모델</text><text x="544" y="345" font-size="16" fill="#18181b">대화 단위로 한 번에</text><line x1="724" y1="300" x2="752" y2="300" stroke="#b8b0a5" stroke-width="3" marker-end="url(#a)"/><rect x="756" y="215" width="196" height="170" rx="18" fill="#ffffff" stroke="#e2dcd2" stroke-width="2"/><text x="776" y="249" font-size="14" fill="#6b6660" letter-spacing="2">04 / VERIFY</text><text x="776" y="285" font-size="22" font-weight="700" fill="#18181b">근거 검증</text><text x="776" y="319" font-size="16" fill="#6b6660">문장 번호 인용</text><text x="776" y="345" font-size="16" fill="#6b6660">코드 + 모델 2중 확인</text><line x1="956" y1="300" x2="984" y2="300" stroke="#b8b0a5" stroke-width="3" marker-end="url(#a)"/><rect x="988" y="215" width="196" height="170" rx="18" fill="#1d1a17" stroke="#1d1a17" stroke-width="2"/><text x="1008" y="249" font-size="14" fill="#f2814b" letter-spacing="2">05 / GRAPH</text><text x="1008" y="285" font-size="22" font-weight="700" fill="#efe9e1">관계·그래프</text><text x="1008" y="319" font-size="16" fill="#efe9e1">중복·번복·의존</text><text x="1008" y="345" font-size="16" fill="#efe9e1">확신 낮으면 사람 검토</text>
<rect x="60" y="430" width="1080" height="170" rx="18" fill="#efeae2"/>
<text x="84" y="470" font-size="14" fill="#6b6660" letter-spacing="2">ACROSS ALL STAGES</text>
<text x="84" y="512" font-size="20" font-weight="700" fill="#18181b">캐시 · 증분 재분석</text>
<text x="84" y="542" font-size="16" fill="#6b6660">콘텐츠 해시 캐시, 바뀐 부분만 다시 처리</text>
<text x="444" y="512" font-size="20" font-weight="700" fill="#18181b">텔레메트리</text>
<text x="444" y="542" font-size="16" fill="#6b6660">요청별 지연·재시도·캐시·토큰·비용 기록</text>
<text x="804" y="512" font-size="20" font-weight="700" fill="#18181b">평가</text>
<text x="804" y="542" font-size="16" fill="#6b6660">회귀 검사 23개 · 비용 상한 평가 실행기</text>
<text x="60" y="640" font-size="15" fill="#6b6660">사내 도구 구조를 직접 그린 개요도입니다. 실제 화면과 데이터는 포함하지 않습니다.</text>
</svg>